<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador de Clubes de Fútbol</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Directorio de Clubes</h1>
        
        <label for="buscar">Buscar equipo:</label>
        <input id="buscar" type="text" placeholder="Ej. Arsenal, Barcelona...">

        <label for="liga">Categoría:</label>
        <select id="liga">
            <option value="English Premier League">Premier League</option>
            <option value="English League Championship">Championship</option>
            <option value="English League 1">League One</option>
            <option value="English League 2">League Two</option>
        </select>
    </header>

    <main>
        <button id="cargar">Cargar Equipos</button>
        <section id="galeria"></section>
    </main>

    <footer>
        <p>Proyecto desarrollado para Front End</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
